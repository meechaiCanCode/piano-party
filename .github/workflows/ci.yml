name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services: 
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ppdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ppdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/ppdb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Create .env.local
        run: cp .env.local.EXAMPLE .env.local

      - name: Load schema and seed data
        run: npm run db:reset

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
  
